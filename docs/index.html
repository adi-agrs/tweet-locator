<!DOCTYPE html>
<html>
<head>
    <title>RecallX — Semantic Search</title>
    <script type="module" src="search.js"></script>
    <link rel="stylesheet" href="static/style.css">
    
</head>
<body>
    <h1>RecallX</h1>
    <p class="subtitle">semantic search for your Twitter history</p>

    <div class="upload-area" id="upload-area">
        <p>click to upload your tweet_history.json</p>
        <input type="file" id="file-input" accept=".json">
    </div>

    <div class="search-container">
        <input type="text" id="search-bar" placeholder="describe the tweet you're looking for...">
        <button id="search-btn">Search</button>
    </div>

    <div id="status"></div>
    <div id="tweet-list"></div>

    <script type="module" src="search.js"></script>
</body>
</html>
