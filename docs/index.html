<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset="utf-8">
    <title>RecallX — AI Search</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <header>
      <div id="header-line" class="header-line">
        <h1>Recall<img src="static/images/X_icon.svg" class="x-icon" id="x-icon"> AI</h1>
      </div>
    </header>
    <p class="subtitle">semantic search for your Twitter history</p>

<!-- Upload View -->
    <div id="upload-section">
        <div class="upload-area" id="upload-area">
            <p>click to upload your tweet_history.json</p>
            <input type="file" id="file-input" accept=".json">
        </div>
    </div>

    <div id="search-section" class="hidden">
        <div class="search-container">
            <button id="download-btn" class="download-btn">.json</button>
            <input type="text" id="search-bar" placeholder="search your history...">
            <button id="search-btn" class="search-btn">search</button>
        </div>
    </div>
    <button class="top-btn" id="top-btn" style="display: flex;">↑</button>
    <div id="extension-link">
        <a href="https://adi-agrs.github.io/tweet-locator" class="extension-link" target="_blank">extension to record your tweets!</a>
    </div>
    <div id="status"></div>
    <div id="tweet-list"></div>
    <script type="module" src="search.js"></script>
</body>
</html>
