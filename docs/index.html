<!DOCTYPE html>
<html>
<head>
    <title>RecallX — Semantic Search</title>
    <script type="module" src="search.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #000613;
            color: #fafafa;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
            background-image:
                linear-gradient(to right, rgb(30, 33, 37) 1px, transparent 1px),
                linear-gradient(to bottom, rgb(30, 33, 37) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
        }

        h1 {
            font-size: 3rem;
            color: #1DA1F2;
            text-align: center;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 48px;
        }

        .upload-area {
            border: 2px dashed #1DA1F2;
            padding: 40px;
            text-align: center;
            margin-bottom: 32px;
            cursor: pointer;
        }

        .upload-area:hover {
            background-color: rgba(29, 161, 242, 0.05);
        }

        input[type="file"] {
            display: none;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: 1px solid #1DA1F2;
            color: #fafafa;
            padding: 10px 16px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        button {
            background-color: #1DA1F2;
            color: #000613;
            border: none;
            padding: 10px 24px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #fafafa;
        }

        #status {
            text-align: center;
            color: #999;
            margin-bottom: 24px;
            min-height: 24px;
        }

        .tweet-card {
            border: 1px solid #1e2125;
            padding: 16px;
            margin-bottom: 16px;
        }

        .tweet-user {
            color: #1DA1F2;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .tweet-text {
            color: #fafafa;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        a {
            color: #999;
            text-decoration: none;
            font-size: 0.85rem;
        }

        a:hover { color: #1DA1F2; }
    </style>
</head>
<body>
    <h1>RecallX</h1>
    <p class="subtitle">semantic search for your Twitter history</p>

    <div class="upload-area" id="upload-area">
        <p>click to upload your tweet_history.json</p>
        <input type="file" id="file-input" accept=".json">
    </div>

    <div class="search-container">
        <input type="text" id="search-bar" placeholder="describe the tweet you're looking for...">
        <button id="search-btn">Search</button>
    </div>

    <div id="status"></div>
    <div id="tweet-list"></div>

    <script type="module" src="search.js"></script>
</body>
</html>
